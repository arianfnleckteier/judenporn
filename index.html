<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>juden porn ja</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <video id="bg-video" loop playsinline autoplay muted>
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('bg-video');

        // 1. Ensure muted autoplay starts immediately
        video.muted = true;
        const startPlay = () => {
            const promise = video.play();
            if (promise !== undefined) {
                promise.catch(() => {
                    // Fallback retry if needed
                    video.muted = true;
                    video.play().catch(() => {});
                });
            }
        };

        startPlay();
        window.addEventListener('load', startPlay);
        document.addEventListener('DOMContentLoaded', startPlay);

        // 2. Unmute on first user interaction
        // Browsers strictly require user gestures (click/touch/keypress) to enable audio
        function enableAudio() {
            video.muted = false;
            video.volume = 1.0;
            video.play().catch(() => {});

            // Remove listeners once audio is successfully enabled
            if (!video.muted) {
                userGestures.forEach(evt => {
                    window.removeEventListener(evt, enableAudio);
                });
            }
        }

        const userGestures = ['click', 'touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'];
        userGestures.forEach(evt => {
            window.addEventListener(evt, enableAudio, { passive: true });
        });
    </script>
</body>

</html>
